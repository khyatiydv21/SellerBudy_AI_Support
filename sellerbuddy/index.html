<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SellerBuddy - AI Seller Support</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--ink:#1c2333;--muted:#6b7385;--brand:#d9262c;--line:#e3e6ee;--me:#d9262c;--bot:#eef0f6}
  @media (prefers-color-scheme: dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2a313f;--bot:#262d3a}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
  header b{font-size:18px}
  header span{color:var(--muted);font-size:13px}
  .wrap{max-width:1000px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:1fr 260px;gap:14px}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  #chat{height:62vh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;line-height:1.45;font-size:14.5px;white-space:pre-wrap}
  .me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:999px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--brand)}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14.5px}
  button.send{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  aside{padding:14px}
  aside h3{margin:0 0 10px;font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border:0}
  .tag{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bot)}
  .high,.frustrated,.yes{background:#fde2e3;color:#b3141a}
  .medium{background:#fff1d6;color:#8a5a00}
  .low,.positive,.no{background:#dff5e5;color:#17692f}
  .small{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<header><b>SellerBuddy</b><span>AI support assistant for marketplace sellers</span></header>
<div class="wrap">
  <div class="card">
    <div id="chat"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><input id="q" placeholder="Ask about payments, listings, shipping, returns..." autocomplete="off"><button class="send" id="b">Send</button></form>
  </div>
  <aside class="card">
    <h3>Ticket analysis</h3>
    <div class="row"><span>Category</span><span class="tag" id="cat">-</span></div>
    <div class="row"><span>Priority</span><span class="tag" id="pri">-</span></div>
    <div class="row"><span>Sentiment</span><span class="tag" id="sen">-</span></div>
    <div class="row"><span>Needs human?</span><span class="tag" id="hum">-</span></div>
    <div class="small">Every message is auto-triaged by the AI. Answers come only from the FAQ knowledge base; if it is not covered, the bot flags it for a human agent.</div>
  </aside>
</div>
<script>
const chat=document.getElementById("chat"), q=document.getElementById("q"), b=document.getElementById("b");
const history=[];
const samples=["When will I get my payment?","Why was my listing rejected?","Courier did not come for pickup","My account is blocked and I am losing sales!"];
samples.forEach(s=>{const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=s;c.onclick=()=>{q.value=s;send()};document.getElementById("chips").appendChild(c)});

function add(text,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function setTag(id,val,cls){const e=document.getElementById(id);e.textContent=val;e.className="tag "+(cls||"")}
add("Hi! I'm SellerBuddy. Ask me anything about payments, listings, shipping, returns or your account.","bot");

async function send(){
  const text=q.value.trim(); if(!text) return;
  q.value=""; b.disabled=true;
  add(text,"me"); history.push({role:"user",content:text});
  const typing=add("Thinking...","bot");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Request failed");
    typing.textContent=d.reply; history.push({role:"assistant",content:d.reply});
    setTag("cat",d.category); setTag("pri",d.priority,d.priority); setTag("sen",d.sentiment,d.sentiment);
    setTag("hum",d.needs_human?"Yes":"No",d.needs_human?"yes":"no");
  }catch(e){typing.textContent="Sorry, something went wrong: "+e.message}
  b.disabled=false; q.focus();
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();send()});
</script>
</body>
</html>
